version: '3.9'

services:
  app:
    build:
      context: .
      target: production
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-jwt-secret-change-me
      LOG_LEVEL: info
    volumes:
      # Mount source for live-reload with nodemon (dev only)
      - ./src:/app/src:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - attendance-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - attendance-net

  # Optional: Adminer for quick DB inspection at http://localhost:8080
  adminer:
    image: adminer:latest
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    networks:
      - attendance-net
    profiles:
      - tools

volumes:
  postgres_data:

networks:
  attendance-net:
    driver: bridge

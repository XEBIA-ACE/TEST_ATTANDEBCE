version: '3.9'

services:
  # ─── API Service ──────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: deps  # Use deps stage for dev (includes nodemon)
    command: npx nodemon src/server.js
    container_name: attendance-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-in-production
      JWT_EXPIRES_IN: 7d
      LOG_LEVEL: debug
      CORS_ORIGIN: '*'
    volumes:
      # Hot-reload: mount source code
      - ./src:/app/src
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance-net

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: attendance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d attendance_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - attendance-net

  # ─── Database migration runner ────────────────────────────────────────────────
  migrate:
    build:
      context: .
      target: deps
    command: npx knex --knexfile src/db/knexfile.js migrate:latest
    container_name: attendance-migrate
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance-net
    profiles:
      - migrate

  # ─── Seed runner ─────────────────────────────────────────────────────────────
  seed:
    build:
      context: .
      target: deps
    command: npx knex --knexfile src/db/knexfile.js seed:run
    container_name: attendance-seed
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - attendance-net
    profiles:
      - seed

volumes:
  postgres-data:

networks:
  attendance-net:
    driver: bridge

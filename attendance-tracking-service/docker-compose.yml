version: '3.9'

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d attendance_db']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── API Service ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: development
    container_name: attendance_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: /api/v1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: attendance_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: 'false'
      JWT_SECRET: dev_jwt_secret_change_in_production_min_32_chars
      JWT_EXPIRES_IN: 24h
      LOG_LEVEL: debug
      CORS_ORIGIN: 'http://localhost:3000,http://localhost:5173'
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 1000
    volumes:
      # Mount source for hot-reload in development
      - .:/app
      - /app/node_modules  # Prevent host node_modules from overwriting container's
    command: npm run dev

  # ─── pgAdmin (optional UI) ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: attendance_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    profiles:
      - tools  # Only started with: docker compose --profile tools up

volumes:
  postgres_data:
    driver: local
